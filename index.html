<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Amazon Project</title>
	<link rel="stylesheet" type="text/css" href="Amazonproject.css">
	<script src="Amazonproject.js"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
	<div>
		<div class="main-page">
			<div class="items">
				<img class="mainPageItems" src="Amazonproject.png/Socks.jpg">
		    </div>
		    <div class="itemDetails">
				<p class="main-page-title">Black and Gray Athletic Cotton Socks - 6 Pairs</p>
			</div>
			<div class="price-rating">
				<img class="ratings" src="Amazonproject.png/Rating-45.jpg">
				<div class="rating-no">87</div>
			    <p class="screen-price">₹345</p>
			</div>
			<div class="selectItems">
				<select class="noOfItems">
					<option value="1">1</option>
					<option value="1">2</option>
					<option value="1">3</option>
					<option value="1">4</option>
					<option value="1">5</option>
					<option value="1">6</option>
					<option value="1">7</option>
					<option value="1">8</option>
					<option value="1">9</option>
					<option value="1">10</option>
				</select>
		    </div>
		    <div class="addingItems">
		    	<button class="cartButton">Add To Cart</button>
		    </div>
		</div>
	</div>
</body>
</html>
