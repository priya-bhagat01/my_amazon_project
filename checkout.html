<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Checkout</title>
	<link rel="stylesheet" type="text/css" href="Amazonproject.css/Checkout.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
	<div class="checkout-main">
			<div class="checkout-header">
				<div class="left-section">
					<a href="index.html" class="home-page">
						<div class="amazon-logo">
							<img class="logo" src="Amazonproject.png/Amazon-logo2.jpg">
						</div>
				    </a>
				</div>
				<div class="mid-section">
					<div class="checkoutPage">
						<p class="check-title">Checkout(
						  <a href="index.html" class="no-of-items">0 items</a>
					    )</p>
					</div>
				</div>
				<div class="right-section">
					<div class="lockIcon">
						<img class="lock" src="Amazonproject.png/Lock-icon.jpg">
					</div>
				</div>
		    </div>

		    <div class="Review">
		    	<p>Review Your Order</p>
		    </div>
	    <div class="bill">
		    <div class="added-products">
		    	<div class="cart-status">
		    		Your cart is empty
		    	</div>
		    	<a href="index.html" class="moreProducts">
			    	<button class="addProduct">
			    		View products
			    	</button>
		        </a>
		    </div>

		    <div class="orders">
		    	<div class="order-title">
		    		<p>Order Summary</p>
		    	</div>

	    		<div class="items-no">
	    		   <p>Items(0):</p>
	    		</div>
	    		<div class="items-price">
	    		   <p>₹0</p>
	    	    </div>

	    		<div class="shipping-options">
	    		    <p>Shipping & handling:</p>
	    	    </div>
		    	<div class="shipping-price">
		    		<p>₹0</p>
		    	</div>

	    		<div class="rawTotal-value">
	    		    <p>Total before Tax:</p>
	    	    </div>
		    	<div class="rawTotal-price">
		    		<p>₹0</p>
		    	</div>

	    		<div class="tax-percent">
	    		    <p>Estimated tax (10%):</p>
	    	    </div>
		    	<div class="tax-price">
		    		<p>₹0</p>
		    	</div>

	    		<div class="finalTotal">
	    		    <p>Order total:</p>
	    	    </div>
		    	<div class="finalTotal-price">
		    		<p>₹0</p>
		    	</div>

		    	<div class="order-button">
		    		<button class="place-order">
		    			Place Your Order
		    		</button>
		    	</div>
		    </div>
	    </div>
	</div>

</body>
</html>
