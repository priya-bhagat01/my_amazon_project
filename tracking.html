<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tracking</title>
	<link rel="stylesheet" type="text/css" href="Amazonproject.css/TrackingHead.css">
	<link rel="stylesheet" type="text/css" href="Amazonproject.css/Tracking.css">
	<script type="module" src="Amazonproject.js/Tracking.js" defer></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
	<div class="header">
		<a href="index.html" class="header-link">
			<div class="AmazonIcon">
				<img class="AmazonIconImage" src="Amazonproject.png/Amazon-logo.jpg">
			</div>
	    </a>
		<div class="search">
			<input class="searchButton" type="text" placeholder="Search">
			<div class="searchIcon">
				<img class="searchIconImage" src="Amazonproject.png/Search-icon.jpg">
			</div>
		</div>
		<div class="ordersIcon">
			<a href="orders.html" class="header-link">
				<div class="orderHistory">
					<div class="returnsPage">
						<p class="return-para">Returns</p>
					</div>
					<div class="ordersPage">
						<p class="order-para">&Orders</p>
					</div>
				</div>
		    </a>
		    <a href="checkout.html" class="header-link">
				<div class="cartPage">
				<img class="cartIcon" src="Amazonproject.png/Cart-icon.jpg">
				<div class="cartCount">0</div>
					<p class="cart-para">Cart</p>
				</div>
		    </a>
		</div>
	</div>

	<div class="main">
		<div class="view-orders">
			<a class="order-page" href="orders.html">
				View all orders
			</a>
		</div>

		<div class="order-details">
			<div class="arriving-date">
				<p>Arriving on Friday, August 14</p>
			</div>
			<div class="order-name">
				<p>6 Piece White Dinner Plate Set</p>
			</div>
			<div class="order-quantity">
				<p>Quantity: 1</p>
			</div>
			<div class="order-image">
				<img class="placed-order-image" src="Amazonproject.png/Plates.jpg">
			</div>
			<div class="Progress-bar-head">
				<div class="left-section">
					<p>Preparing</p>
				</div>
				<div class="mid-section">
					<p>Shipped</p>
				</div>
				<div class="right-section">
					<p>Delivered</p>
				</div>
			</div>
			<div class="Progress-bar-container">
				<div class="Progress-bar"></div>
			</div>
		</div>
	</div>
</body>
</html>
