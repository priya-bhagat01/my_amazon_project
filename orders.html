<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Orders</title>
	<link rel="stylesheet" type="text/css" href="Amazonproject.css/Orders.css">
	<link rel="stylesheet" type="text/css" href="Amazonproject.css/OrdersHead.css">
	<script type="module" src="Amazonproject.js/Orders.js"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
	<div class="header">
		<a href="index.html" class="header-link">
			<div class="AmazonIcon">
				<img class="AmazonIconImage" src="Amazonproject.png/Amazon-logo.jpg">
			</div>
	    </a>
		<div class="search">
			<input class="searchButton" type="text" placeholder="Search">
			<div class="searchIcon">
				<img class="searchIconImage" src="Amazonproject.png/Search-icon.jpg">
			</div>
		</div>
		<div class="ordersIcon">
			<a href="orders.html" class="header-link">
				<div class="orderHistory">
					<div class="returnsPage">
						<p class="return-para">Returns</p>
					</div>
					<div class="ordersPage">
						<p class="order-para">&Orders</p>
					</div>
				</div>
		    </a>
		    <a href="checkout.html" class="header-link">
				<div class="cartPage">
				<img class="cartIcon" src="Amazonproject.png/Cart-icon.jpg">
				<div class="cartCount">0</div>
					<p class="cart-para">Cart</p>
				</div>
		    </a>
		</div>
	</div>

	<div class="main"></div>
</body>
</html>
