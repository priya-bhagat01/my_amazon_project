<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Orders</title>
	<link rel="stylesheet" type="text/css" href="Amazonproject.css/Orders.css">
</head>
<body>
	<div class="header">
		<a href="index.html" class="header-link">
			<div class="AmazonIcon">
				<img class="AmazonIconImage" src="Amazonproject.png/Amazon-logo.jpg">
			</div>
	    </a>
		<div class="search">
			<input class="searchButton" type="text" placeholder="Search">
			<div class="searchIcon">
				<img class="searchIconImage" src="Amazonproject.png/Search-icon.jpg">
			</div>
		</div>
		<div class="ordersIcon">
			<a href="orders.html" class="header-link">
				<div class="orderHistory">
					<div class="returnsPage">
						<p class="return-para">Returns</p>
					</div>
					<div class="ordersPage">
						<p class="order-para">&Orders</p>
					</div>
				</div>
		    </a>
		    <a href="checkout.html" class="header-link">
				<div class="cartPage">
				<img class="cartIcon" src="Amazonproject.png/Cart-icon.jpg">
				<div class="cartCount">0</div>
					<p class="cart-para">Cart</p>
				</div>
		    </a>
		</div>
	</div>

	<div class="titlePara">
		<p class="para">Your orders</p>
	</div>

	<div class="order-container">
		<div class="order-head">
			<div class="left-section">
				<p>Order Placed: August 10</p>
			</div>
			<div class="mid-section">
				<p>Total: ₹549</p>
			</div>
			<div class="right-section">
				<p>Order ID: 2984c05f-01bc-4a42-aa66-84ef7c5b73c7</p>
			</div>
		</div>

		<div class="order-main">
			<div class="imageContainer">
				<img src="Amazonproject.png/Tshirt.jpg">
			</div>

			<div class="order-details">
				<div class="order-name">
					<p>Adults Plain Cotton T-Shirt - 2 Pack</p>
				</div>
				<div class="order-date">
					<p>Arriving on: August 19</p>
				</div>
				<div class="order-quantity">
					<p>Quantity: 1</p>
				</div>
				<div class="buy-again">
					<button class="BuyAgainButton">
						<img src="Amazonproject.png/BuyAgain.jpg" class="BuyAgainImage">
						<p class="BuyAgainpara">Buy it again</p>
					</button>
				</div>
			</div>

			<div class="track-order">
				<button class="tracking-package">
					<p class="tracking-para">Track package</p>
				</button>
			</div>
		</div>
	</div>
</body>
</html>
